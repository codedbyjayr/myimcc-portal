server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Public bundles are imported by the opaque, sandboxed role-preview iframe.
    location ~ ^/(review-assets/)?shared/dist/ {
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
