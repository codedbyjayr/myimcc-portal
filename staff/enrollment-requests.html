  <link rel="stylesheet" href="../shared/portal.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body><main class="enrollment-workspace">
  <a id="back" class="back-link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg>Back to portal</a>
  <header class="workspace-heading"><span class="heading-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4"/></svg></span><div><p class="eyebrow">MyIMCC · Academic Services</p><h1>Enrollment Requests</h1><p>Review proposed subject loads, make enrollment decisions, and keep track of each student's progress.</p></div></header>
<section class="review-toolbar" aria-label="Request filters"><div class="filter-field"><label for="statusFilter">Request status</label>
  <select id="statusFilter">
    <option value="pending">Pending requests</option>
    <option value="approved">Approved history</option>
    <option value="rejected">Rejected history</option>
    <option value="all">All decisions</option>
  </select>
  </div><button id="refresh" class="refresh-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 11-1l3 6M4 12l3 6a7 7 0 0 0 11-1"/></svg>Refresh requests</button></section>
  <p id="message" class="request-message" role="status" aria-live="polite"></p>
  <div id="requests"></div>
</main>
