<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile — MyIMCC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #E7338A;
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .onboard-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #fff;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .form-error {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="onboard-card">
        <h1>Complete Profile</h1>
        <p>Please supply your details and choose your primary portal role for administrator verification.</p>

        <form id="onboardForm">
            <div class="field">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. Juan Cruz" required>
            </div>

            <div class="field">
                <label for="idNumber">School ID / Employee Number</label>
                <input type="text" id="idNumber" placeholder="e.g. 2024-1049" required>
            </div>

            <div class="field">
                <label for="requestedRole">I am requesting access as a:</label>
                <select id="requestedRole" required>
                    <option value="student">Student</option>
                    <option value="teacher">Faculty / Instructor</option>
                    <option value="staff">Administrative Staff</option>
                </select>
            </div>

            <div id="formError" class="form-error" hidden></div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit for Approval</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/env-config.js"></script>
    <script src="../shared/supabase-config.js"></script>
    <script src="select-role.js"></script>
</body>

</html>
