<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyIMCC Portal</title>
<meta http-equiv="refresh" content="0; url=student/login.html">
<style>
  body { margin: 0; background: #141019; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
  .loader { text-align: center; }
  .spinner { width: 40px; height: 40px; border: 3px solid #382E45; border-top-color: #E7338A; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  .text { color: #9A90AC; font-size: 14px; font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <div class="text">Loading MyIMCC Portal...</div>
</div>
</body>
</html>
