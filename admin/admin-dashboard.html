<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — User Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #E7338A;
      --primary-hover: #c82272;
      --bg-dark: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .brand {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: var(--primary);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .dashboard-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      text-align: left;
    }

    th {
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      padding: 12px;
      border-bottom: 1px solid var(--surface-border);
    }

    td {
      padding: 16px 12px;
      border-bottom: 1px solid var(--surface-border);
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .badge-approved {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-approve {
      background: var(--success);
      color: #fff;
      margin-right: 8px;
    }

    .btn-reject,
    .btn-revoke {
      background: var(--danger);
      color: #fff;
    }

    .btn-action:hover {
      opacity: 0.85;
    }

    /* Interactive Role Dropdown Styling */
    .role-select {
      background: #0f172a;
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .role-select:focus {
      border-color: var(--primary);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 32px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="brand">MyIMCC Admin Portal</div>
    <div class="user-info">
      <span id="adminEmail" style="color: var(--text-muted); font-size: 14px;">Loading...</span>
      <button id="logoutBtn" class="btn-logout">Sign Out</button>
    </div>
  </div>

  <!-- PENDING ACCESS REQUESTS -->
  <div class="dashboard-card">
    <div class="card-title">
      <span>Pending Access Requests</span>
      <span id="pendingCount" class="badge badge-pending">0 Pending</span>
    </div>

    <div id="pendingTableWrap">
      <table>
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Email</th>
            <th>ID Number</th>
            <th>Requested Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="pendingTableBody"></tbody>
      </table>
      <div id="noPendingMsg" class="empty-state" style="display: none;">No pending registration requests found.</div>
    </div>
  </div>

  <!-- APPROVED USERS (WITH EDITABLE ROLES) -->
  <div class="dashboard-card">
    <div class="card-title">Approved Portal Users & Role Management</div>
    <table>
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Email</th>
          <th>ID Number</th>
          <th>Assigned Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="approvedTableBody"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/env-config.js"></script>
  <script src="../shared/supabase-config.js"></script>
  <script src="admin-dashboard.js"></script>
</body>

</html>
