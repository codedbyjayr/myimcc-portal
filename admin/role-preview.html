<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyIMCC — Developer dashboard preview</title>
  <link rel="stylesheet" href="../shared/portal.css">
  <link rel="stylesheet" href="role-preview.css">
</head>
<body>
  <header>
    <h1>Dashboard preview</h1>
    <label for="previewRole">View as role</label>
    <select id="previewRole" disabled>
      <option value="student">Student</option><option value="faculty">Faculty</option>
      <option value="dean">Dean</option><option value="registrar">Registrar</option>
      <option value="staff">Staff</option><option value="admin">Admin</option>
    </select>
    <a href="admin-dashboard.html">Exit preview</a>
    <p id="previewStatus" role="status">Checking developer access…</p>
    <p>Read-only layout preview. No personal records are loaded. Your account role stays unchanged.
      Actual users must test data and actions through their own assigned roles.</p>
  </header>
  <iframe id="previewFrame" title="Student dashboard layout preview" sandbox="allow-scripts" hidden></iframe>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../env-config.js"></script>
  <script src="../shared/supabase-config.js"></script>
  <script type="module" src="role-preview.js"></script>
</body>
</html>
