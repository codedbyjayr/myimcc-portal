<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyIMCC — Staff Clearance</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../env-config.js"></script>
    <script src="../shared/supabase-config.js"></script>
<script src="../shared/identity.js"></script>
<script src="../shared/datetime.js"></script>
<script src="../shared/authGuard.js"></script>
    <script src="../shared/loading.js"></script>
    <script src="../shared/ui.js"></script>

    <link rel="stylesheet" href="registrar-dashboard.css">
    <link rel="stylesheet" href="../shared/ui.css">
    <link rel="stylesheet" href="../shared/loading.css">
    <link rel="stylesheet" href="../shared/rwd.css">
    <script>(function(){try{var t=localStorage.getItem('myimcc_theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(_){}})();</script>
</head>

<body><div class="app"><div class="sidebar-overlay" id="sidebarOverlay"></div><aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="logo">
                  <svg viewBox="0 0 42 42" class="brand-mark-svg" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="42" height="42" rx="10" fill="#E32B4F"/>
                    <circle cx="21" cy="11.5" r="2.2" fill="#FFFFFF"/>
                    <path d="M21 15V28.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
                    <path d="M9.5 27.5V14L19.5 21.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M32.5 27.5V14L22.5 21.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9.5 27.5C13.5 25 17.5 25.5 21 28.5C24.5 25.5 28.5 25 32.5 27.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </div>
                <div>
                    <div class="name">MyIMCC</div>
                    <div class="tag">STAFF PORTAL</div>
                </div>
                <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close Navigation" type="button">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="who">
                <div class="avatar" aria-hidden="true"></div>
                <div class="meta">
                    <div id="userName">Staff</div>
                    <div id="staffOffice">Clearance Office</div>
                </div>
            </div>

            <nav aria-label="Staff sections"><div class="nav-label">Main Menu</div><button class="nav-item active" type="button" aria-current="page"><span class="ic" aria-hidden="true">✓</span>Clearance</button></nav>

            <div class="sidebar-foot">
                MyIMCC Portal<br>Staff Clearance Access
            </div>
        </aside><main class="main"><div class="topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" id="menuToggle" aria-label="Open Navigation" aria-expanded="false" aria-controls="sidebar" type="button">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                            <line x1="4" y1="6" x2="20" y2="6"></line>
                            <line x1="4" y1="12" x2="20" y2="12"></line>
                            <line x1="4" y1="18" x2="20" y2="18"></line>
                        </svg>
                    </button>
                    <h1 id="pageTitle">Clearance</h1>
                </div>
                <div class="topbar-right" style="display:flex;align-items:center;gap:8px;"><button class="btn btn-ghost" id="signOutBtn" type="button">Sign out</button>
                    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle Dark Mode">
                        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>
                        </svg>
                        <span id="themeLabel">Dark</span>
                    </button>
                </div>
            </div>

            <p id="staffStatus" role="status" aria-live="polite"></p><section id="view-clearance"  aria-labelledby="pageTitle">
                <div class="registrar-clearance-layout">
                    <div class="panel registrar-clearance-panel">
                        <div class="panel-head"><h3 id="officeHeading">Student Clearance</h3></div>
                        <label class="sr-only" for="searchInput">Search students</label>
                        <input id="searchInput" type="search" placeholder="Name, student number, or program…">
                        <label for="filterYear">Year level</label>
                        <select id="filterYear">
                            <option value="">All year levels</option><option value="1">1st Year</option>
                            <option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option>
                        </select>
                        <button class="btn btn-ghost" id="refreshClearances" type="button">Refresh clearances</button>
                        <div id="clearanceStudents" class="registrar-clearance-list" role="group" aria-label="Students"></div>
                    </div>
                    <div class="panel registrar-clearance-panel registrar-clearance-details" id="clearanceDetails" aria-live="polite">
                        <div class="panel-head"><h3 id="registrarClearanceTitle">Select a student</h3></div>
                        <p>Choose a student to review their clearance.</p>
                    </div>
                </div>
            </section>

            </main></div><script src="../shared/faculty-chrome.js"></script><script src="staff-dashboard.js"></script></body></html>
